[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-local-ai"
version = "0.1.0"
description = "Local-only autonomous development controller (implementation in progress)"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"my_local_ai.ui" = ["dashboard.css", "workbench.css", "workbench.js", "workbench-music.js", "music-*.ogg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
