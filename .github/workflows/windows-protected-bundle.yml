name: windows-protected-bundle-untrusted

on:
  push:
    branches: [dev/instant-implementation-v1]
    paths:
      - '.github/workflows/windows-protected-bundle.yml'
      - 'scripts/build_protected_windows.py'
      - 'scripts/preflight_protected_windows.py'
      - 'src/my_local_ai/**'
      - 'pyproject.toml'
      - 'tests/unit/test_windows_protected_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-image-build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Install pinned builder in disposable CI environment
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3
      - name: Frozen-entrypoint synthetic unit gates
        run: python -m unittest discover -s tests/unit -p test_windows_protected_build.py -v
      - name: Build standalone one-folder images (NO install or service registration)
        run: python scripts/build_protected_windows.py --output dist/mla-protected-v1
      - name: Assert four binaries and untrusted manifest
        shell: pwsh
        run: |
          $dir = 'dist/mla-protected-v1'
          @('MyLocalAI.owner.v1','MyLocalAI.reviewer.v1','MyLocalAI.scanner.v1','MyLocalAI.OwnerUI') | ForEach-Object {
            if (-not (Test-Path "$dir/$_/$_.exe")) { throw "missing image $_" }
            if (-not (Test-Path "$dir/$_/_internal")) { throw "missing one-folder bundle $_" }
          }
          $m = Get-Content "$dir/UNTRUSTED_BUILD_MANIFEST.json" -Raw | ConvertFrom-Json
          if ($m.trusted_or_installed -ne $false -or $m.windows_native_acceptance -ne 'NOT_RUN') {
            throw 'build manifest incorrectly claims trust'
          }
      - name: Read-only native preflight must HOLD without Owner-provisioned HKLM/SCM
        shell: pwsh
        run: |
          $stage = (Resolve-Path 'dist/mla-protected-v1').Path
          $simulated = Join-Path $env:RUNNER_TEMP 'mla-unprivileged-simulated-copy'
          New-Item -ItemType Directory -Path $simulated -ErrorAction Stop | Out-Null
          @('MyLocalAI.owner.v1','MyLocalAI.reviewer.v1','MyLocalAI.scanner.v1','MyLocalAI.OwnerUI') | ForEach-Object {
            Copy-Item -Path (Join-Path $stage $_) -Destination $simulated -Recurse -ErrorAction Stop
          }
          $env:MLA_STAGED_DIR = $stage
          $env:MLA_SIMULATED_DIR = $simulated
          python -c "import os,sys;from pathlib import Path;sys.path.insert(0,'scripts');from preflight_protected_windows import preflight;r=preflight(Path(os.environ['MLA_STAGED_DIR']),Path(os.environ['MLA_SIMULATED_DIR']));assert r['decision']=='HOLD' and r['precheck']=='BLOCKED' and r['runtime_authorized'] is False;print('EXPECTED_WINDOWS_CI_HOLD:',r['code'])"
      - uses: actions/upload-artifact@v4
        with:
          name: MLA-untrusted-Windows-protected-four-images
          path: dist/mla-protected-v1/
          if-no-files-found: error
          retention-days: 7
