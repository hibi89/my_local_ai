name: windows-protected-bundle-untrusted

on:
  push:
    branches: [dev/instant-implementation-v1]
    paths:
      - '.github/workflows/windows-protected-bundle.yml'
      - 'scripts/build_protected_windows.py'
      - 'scripts/preflight_protected_windows.py'
      - 'src/my_local_ai/**'
      - 'pyproject.toml'
      - 'tests/unit/test_windows_protected_preflight.py'
      - 'tests/windows/test_pipe_client_identity_native.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-image-build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Install pinned builder in disposable CI environment
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3
      - name: Frozen-entrypoint synthetic unit gates
        run: python -m unittest discover -s tests/unit -p test_windows_protected_build.py -v
      - name: Native Win32 ephemeral pipe SID and RevertToSelf gate (no Owner trust)
        run: python -m unittest discover -s tests/windows -p test_pipe_client_identity_native.py -v
      - name: Read-only native CNG Software KSP availability (no keys or Owner trust)
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          $raw = python -m my_local_ai local-op run --request 'CNG 서명 공급자 확인'
          if ($LASTEXITCODE -ne 0) { throw 'software KSP read-only preflight unavailable' }
          $probe = $raw | ConvertFrom-Json
          $item = $probe.checks.'cng-provider-status'
          if ($probe.state -ne 'READ_ONLY_RESULT' -or $item.software_ksp_available -ne $true -or
              $item.protected_trust_verified -ne $false -or $item.key_provisioned_verified -ne $false -or
              $probe.execution_authority_granted -ne $false -or $probe.os_settings_changed -ne $false) {
            throw 'unsafe software KSP or approval result'
          }
          Write-Host 'READ_ONLY_KSP_FOUND_NO_KEY_NO_OWNER_TRUST'
      - name: Host-only Windows read-only intake must remain HOLD (NO Owner trust)
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          # GitHub pwsh may stop on an expected nonzero native exit. Explicitly
          # disable only this shell's automatic native-error escalation and
          # assert the precise fail-closed exit code below.
          $PSNativeCommandUseErrorActionPreference = $false
          # A nonzero exit is intentional. This action never provisions keys,
          # services, accounts, ACLs, registry values, or Owner approval.
          $raw = python scripts/preflight_protected_windows.py --host-readonly
          $code = $LASTEXITCODE
          if ($code -ne 2) { throw 'host intake unexpectedly returned GO or crashed' }
          $report = $raw | ConvertFrom-Json
          if ($report.schema -ne 'mla-protected-host-intake/v1' -or
              $report.decision -ne 'HOLD' -or
              $report.read_only -ne $true -or
              $report.os_settings_changed -ne $false -or
              $report.runtime_authorized -ne $false -or
              $report.owner_approval_verified -ne $false -or
              $report.protected_signer_verified -ne $false -or
              $report.independent_f18_verified -ne $false -or
              $report.defender_scan_verified -ne $false -or
              $report.p2 -ne 'LOCKED' -or
              $report.formal_verified_rate -ne 'UNASSESSED') {
            throw 'host intake leaked trust authority'
          }
          Write-Host 'WINDOWS_HOST_INTAKE_READ_ONLY_HOLD_CONFIRMED'
          # The expected Python exit code 2 remains in LASTEXITCODE. A pwsh
          # GitHub Actions wrapper can propagate that stale code despite all
          # assertions passing. Finish only after checking the HOLD contract.
          exit 0
      - name: Synthetic protected Windows preflight regression (NO Owner acceptance)
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          python -m unittest discover -s tests/unit -p test_windows_protected_preflight.py -v
          if ($LASTEXITCODE -ne 0) { throw 'synthetic protected preflight regression failed' }
      - name: Build standalone one-folder images (NO install or service registration)
        run: python scripts/build_protected_windows.py --output dist/mla-protected-v1
      - name: Assert four binaries and untrusted manifest
        shell: pwsh
        run: |
          $dir = 'dist/mla-protected-v1'
          @('MyLocalAI.owner.v1','MyLocalAI.reviewer.v1','MyLocalAI.scanner.v1','MyLocalAI.OwnerUI') | ForEach-Object {
            if (-not (Test-Path "$dir/$_/$_.exe")) { throw "missing image $_" }
            if (-not (Test-Path "$dir/$_/_internal")) { throw "missing one-folder bundle $_" }
          }
          $m = Get-Content "$dir/UNTRUSTED_BUILD_MANIFEST.json" -Raw | ConvertFrom-Json
          if ($m.trusted_or_installed -ne $false -or $m.windows_native_acceptance -ne 'NOT_RUN') {
            throw 'build manifest incorrectly claims trust'
          }
      - name: Read-only native preflight must HOLD without Owner-provisioned HKLM/SCM
        shell: pwsh
        run: |
          $stage = (Resolve-Path 'dist/mla-protected-v1').Path
          $simulated = Join-Path $env:RUNNER_TEMP 'mla-unprivileged-simulated-copy'
          New-Item -ItemType Directory -Path $simulated -ErrorAction Stop | Out-Null
          @('MyLocalAI.owner.v1','MyLocalAI.reviewer.v1','MyLocalAI.scanner.v1','MyLocalAI.OwnerUI') | ForEach-Object {
            Copy-Item -Path (Join-Path $stage $_) -Destination $simulated -Recurse -ErrorAction Stop
          }
          $env:MLA_STAGED_DIR = $stage
          $env:MLA_SIMULATED_DIR = $simulated
          python -c "import os,sys;from pathlib import Path;sys.path.insert(0,'scripts');from preflight_protected_windows import preflight;r=preflight(Path(os.environ['MLA_STAGED_DIR']),Path(os.environ['MLA_SIMULATED_DIR']));assert r['decision']=='HOLD' and r['precheck']=='BLOCKED' and r['runtime_authorized'] is False;print('EXPECTED_WINDOWS_CI_HOLD:',r['code'])"
      - uses: actions/upload-artifact@v4
        with:
          name: MLA-untrusted-Windows-protected-four-images
          path: dist/mla-protected-v1/
          if-no-files-found: error
          retention-days: 7
